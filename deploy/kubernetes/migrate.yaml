apiVersion: batch/v1
kind: Job
metadata:
  name: supportdesk-migrate-v1
  namespace: secrets-app
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: supportdesk-backend:local
          imagePullPolicy: IfNotPresent
          command: [alembic, -c, backend/alembic.ini, upgrade, head]
          envFrom: [{configMapRef: {name: supportdesk-config}}]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
